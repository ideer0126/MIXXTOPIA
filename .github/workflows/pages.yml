name: Deploy to GitHub Pages

# 三通道部署（#17）：一次构建 stable / beta / preview，单次原子发布。
# - 测试期（无稳定 tag）：`/` 稳定版占位、`/preview/` 预览占位，`/beta/` 用 beta tag 或 main。
# - 首个稳定 tag 之后：`/` 用 stable tag、`/preview/` 用 main、`/beta/` 停用（占位页），不再看 beta tag。
# - 测试期 beta tag 早于通道代码时跳过，回退 main。
# 产物由 tools/build-channels.js 组装；存档键按通道隔离，见 js/main.js。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Quality gates
        run: |
          set -euo pipefail
          for file in js/*.js tools/*.js; do
            node --check "$file"
          done
          node tools/test-engine.js
          node tools/test-main.js
          node tools/test-channels.js

      - name: Resolve channel refs
        id: channels
        run: |
          set -euo pipefail
          git fetch --prune --tags --force origin '+refs/heads/*:refs/remotes/origin/*'

          TAGS_FILE="$(mktemp)"
          BETA_MAIN="${TAGS_FILE}.main.js"
          trap 'rm -f "$TAGS_FILE" "$BETA_MAIN"' EXIT
          git tag --merged origin/main --list 'v*' --sort=-v:refname > "$TAGS_FILE"

          STABLE_TAG="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$' "$TAGS_FILE" | head -n1 || true)"
          BETA_TAG=""

          if [[ -n "$STABLE_TAG" ]]; then
            # 首个稳定版之后 beta 通道废弃：不再构建 beta，也不再看 beta tag。
            STABLE_REF="$STABLE_TAG"
            STABLE_LABEL="$STABLE_TAG"
            PREVIEW_REF="origin/main"
            PREVIEW_LABEL="main@$(git rev-parse --short origin/main)"
            BETA_REF=""
            BETA_LABEL=""
          else
            # 测试期：稳定版/预览版尚未开放；beta 用 tag，没有 tag 时用 main。
            BETA_TAG="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)(\.[0-9]+)?(\+[0-9A-Za-z.-]+)?$' "$TAGS_FILE" | head -n1 || true)"

            # 旧 beta tag 可能早于通道存档隔离；跳过而不是让 beta 写 stable 键。
            if [[ -n "$BETA_TAG" ]]; then
              if git show "${BETA_TAG}:js/main.js" > "$BETA_MAIN" 2>/dev/null; then
                if ! grep -q 'channelKeys' "$BETA_MAIN" || ! grep -q 'MIXXTOPIA_CHANNEL' "$BETA_MAIN"; then
                  echo "beta $BETA_TAG 早于通道存档隔离，跳过 beta 通道"
                  BETA_TAG=""
                fi
              else
                echo "beta $BETA_TAG 缺少 js/main.js，跳过 beta 通道"
                BETA_TAG=""
              fi
            fi

            STABLE_REF=""
            STABLE_LABEL=""
            PREVIEW_REF=""
            PREVIEW_LABEL=""
            if [[ -n "$BETA_TAG" ]]; then
              BETA_REF="$BETA_TAG"
              BETA_LABEL="$BETA_TAG"
            else
              BETA_REF="origin/main"
              BETA_LABEL="main@$(git rev-parse --short origin/main)"
            fi
          fi

          {
            echo "stable_ref=$STABLE_REF"
            echo "stable_label=$STABLE_LABEL"
            echo "beta_ref=$BETA_REF"
            echo "beta_label=$BETA_LABEL"
            echo "preview_ref=$PREVIEW_REF"
            echo "preview_label=$PREVIEW_LABEL"
          } >> "$GITHUB_OUTPUT"

          echo "stable : ${STABLE_REF:-<placeholder>}${STABLE_REF:+ ($STABLE_LABEL)}"
          if [[ -n "$STABLE_TAG" ]]; then
            echo "beta   : <deprecated>"
          else
            echo "beta   : ${BETA_REF:-<placeholder>}${BETA_REF:+ ($BETA_LABEL)}"
          fi
          echo "preview: ${PREVIEW_REF:-<placeholder>}${PREVIEW_REF:+ ($PREVIEW_LABEL)}"

      - name: Build channels
        env:
          STABLE_REF: ${{ steps.channels.outputs.stable_ref }}
          STABLE_LABEL: ${{ steps.channels.outputs.stable_label }}
          BETA_REF: ${{ steps.channels.outputs.beta_ref }}
          BETA_LABEL: ${{ steps.channels.outputs.beta_label }}
          PREVIEW_REF: ${{ steps.channels.outputs.preview_ref }}
          PREVIEW_LABEL: ${{ steps.channels.outputs.preview_label }}
        run: |
          set -euo pipefail
          ARGS=(--out _site)
          if [[ -n "$STABLE_REF" ]]; then
            ARGS+=(--stable-ref "$STABLE_REF" --stable-label "$STABLE_LABEL")
          fi
          if [[ -n "$PREVIEW_REF" ]]; then
            ARGS+=(--preview-ref "$PREVIEW_REF" --preview-label "$PREVIEW_LABEL")
          fi
          if [[ -n "$BETA_REF" ]]; then
            ARGS+=(--beta-ref "$BETA_REF" --beta-label "$BETA_LABEL")
          fi
          node tools/build-channels.js "${ARGS[@]}"

      - name: Verify site
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/beta/index.html
          test -f _site/preview/index.html
          test -f _site/channel.json
          test -f _site/beta/channel.json
          test -f _site/preview/channel.json

          grep -q 'name="mixxtopia-channel" content="stable"' _site/index.html
          grep -q 'name="mixxtopia-channel" content="beta"' _site/beta/index.html
          grep -q 'name="mixxtopia-channel" content="preview"' _site/preview/index.html

          if grep -q 'js/main.js' _site/index.html; then
            grep -q 'js/channel.js' _site/index.html
            if grep -q 'name="robots"' _site/index.html; then
              echo "::error::stable 游戏页不应带 noindex"
              exit 1
            fi
          else
            grep -q '稳定版尚未发布' _site/index.html
            grep -q 'name="robots"' _site/index.html
          fi

          if grep -q 'js/main.js' _site/preview/index.html; then
            grep -q 'js/channel.js' _site/preview/index.html
          else
            grep -q '预览版尚未开放' _site/preview/index.html
          fi
          grep -q 'name="robots"' _site/preview/index.html

          if grep -q 'js/main.js' _site/beta/index.html; then
            grep -q 'js/channel.js' _site/beta/index.html
          elif grep -q '测试版已停用' _site/beta/index.html; then
            echo "beta 已停用占位页 OK"
          else
            grep -q '测试版暂未开放' _site/beta/index.html
          fi
          grep -q 'name="robots"' _site/beta/index.html

          for name in docs tools supabase .github .coderabbit.yaml; do
            if [[ -e "_site/$name" ]]; then
              echo "::error::站点产物混入 $name"
              exit 1
            fi
          done
          JUNK="$(find _site \( -name '.gitkeep' -o -name '.coderabbit.yaml' \) -print -quit)"
          if [[ -n "$JUNK" ]]; then
            echo "::error::站点产物混入占位文件：$JUNK"
            exit 1
          fi
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
