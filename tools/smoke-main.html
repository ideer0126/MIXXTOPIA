  <script>
    window.MIXX_NO_BOOT = true;
    // 账户 / 资料冒烟不连真实后端：默认 fetch 拒绝（验证游客态零上传），
    // 需要验证登录/保存时把 __smokeOnline 切 true，桩返回固定会话与 profiles 行。
    window.MIXX_CLOUD_CONFIG = { url: 'https://smoke.supabase.co', anonKey: 'sb_publishable_smoke' };
    window.__authFetchCalls = 0;
    window.__smokeOnline = false;
    window.__fetchCalls = [];
    window.__cloudRows = [null, null, null];
    window.__statsRow = { user_id: 'u-smoke', play_seconds: 0, remainder_ms: 0,
      device_millis: {}, achievements: [], collections: {} };
    window.__profileRow = { nickname: '小星', avatar: 'muse-3', prefs: { sound: true, touch: 'auto' } };
    function jsonResponse(status, body) {
      return {
        ok: status >= 200 && status < 300,
        status: status,
        json: function () { return Promise.resolve(body); }
      };
    }
    window.fetch = function (url, init) {
      window.__authFetchCalls++;
      var u = String(url);
      var cfg = init || {};
      var call = { url: u, method: cfg.method || 'GET', init: cfg, body: null };
      if (typeof cfg.body === 'string') {
        try { call.body = JSON.parse(cfg.body); } catch (e) { call.body = cfg.body; }
      }
      window.__fetchCalls.push(call);
      if (!window.__smokeOnline) return Promise.reject(new TypeError('smoke: offline'));
      if (u.indexOf('/auth/v1/token?grant_type=') >= 0 || u.indexOf('/auth/v1/signup') >= 0) {
        return Promise.resolve(jsonResponse(200, {
          access_token: 'smoke-access',
          token_type: 'bearer',
          expires_in: 3600,
          refresh_token: 'smoke-refresh',
          user: { id: 'u-smoke', email: 'smoke@example.com' }
        }));
      }
      if (u.indexOf('/rest/v1/rpc/merge_stats') >= 0) {
        var stats = window.__statsRow, b = call.body;
        stats.device_millis[b.p_writer] = Math.max(stats.device_millis[b.p_writer] || 0, b.p_millis);
        var ms = Object.values(stats.device_millis).reduce(function (sum, n) { return sum + n; }, 0);
        stats.play_seconds = Math.floor(ms / 1000); stats.remainder_ms = ms % 1000;
        stats.achievements = Array.from(new Set(stats.achievements.concat(b.p_achievements)));
        stats.collections = window.MIXX.stats.localCollections(window.__cloudRows.map(function (row) { return row && row.data; }));
        return Promise.resolve(jsonResponse(200, [JSON.parse(JSON.stringify(stats))]));
      }
      if (u.indexOf('/rest/v1/saves') >= 0) {
        var params = new URL(u).searchParams;
        var n = Number((params.get('slot') || 'eq.1').slice(3));
        var rows = window.__cloudRows;
        if (call.method === 'GET') return Promise.resolve(jsonResponse(200,
          params.get('select').indexOf('data') >= 0 ? (rows[n - 1] ? [rows[n - 1]] : []) : rows.filter(Boolean)));
        var i = call.method === 'POST' ? call.body.slot - 1 : n - 1;
        if (call.method === 'POST' && rows[i]) return Promise.resolve(jsonResponse(409, {}));
        if (call.method === 'PATCH' && (!rows[i] || params.get('version') !== 'eq.' + rows[i].version)) {
          return Promise.resolve(jsonResponse(200, []));
        }
        rows[i] = { slot: i + 1, version: call.body.version,
          updated_at: new Date(Date.now() + call.body.version).toISOString(), data: call.body.data };
        return Promise.resolve(jsonResponse(200, [rows[i]]));
      }
      if (u.indexOf('/rest/v1/profiles') >= 0) {
        if (call.method === 'PATCH') {
          window.__profileRow = Object.assign({}, window.__profileRow, call.body);
          return Promise.resolve(jsonResponse(200, [window.__profileRow]));
        }
        return Promise.resolve(jsonResponse(200, [window.__profileRow]));
      }
      if (u.indexOf('/auth/v1/logout') >= 0) return Promise.resolve(jsonResponse(204, null));
      return Promise.reject(new Error('smoke: unexpected ' + u));
    };
  </script>

  <script>
    (async function () {
      'use strict';
      var results = [];
      var errors = [];
      window.onerror = function (msg) { errors.push(String(msg)); };
      function ok(name, cond) { results.push((cond ? 'PASS' : 'FAIL') + ' ' + name); }
      function shown(id) { return !document.getElementById(id).classList.contains('hidden'); }
      function text(id) { return document.getElementById(id).textContent; }
      function nextTick() { return new Promise(function (resolve) { setTimeout(resolve, 0); }); }
      async function settle() {
        await nextTick();
        if (game) {
          for (var i = 0; i < 3; i++) {
            await Promise.all([game._authReady, game._profileTask, game._cloudTask, game._statsTask, game.stats && game.stats.task]);
          }
        }
        await nextTick();
      }
      function profilePatches() {
        return window.__fetchCalls.filter(function (c) {
          return c.url.indexOf('/rest/v1/profiles') >= 0 && c.method === 'PATCH';
        });
      }

      // 冒烟数据使用独立的 sessionStorage，避免读写或清理 stable localStorage。
      var smokeStorage = window.sessionStorage;
      // 清掉历史冒烟数据，保证每次运行起点一致。
      try {
        smokeStorage.removeItem('mixxtopia.save.v1');
        smokeStorage.removeItem('mixxtopia.settings.v1');
        smokeStorage.removeItem('mixxtopia.account.v1');
        smokeStorage.removeItem('mixxtopia.cloud.v1');
        Object.keys(smokeStorage).filter(function (key) { return key.indexOf('mixxtopia.stats.v1.') === 0; })
          .forEach(function (key) { smokeStorage.removeItem(key); });
      } catch (e) { /* 存储不可用时仍可验证游戏流程 */ }

      var main = window.MIXX.main;
      try {
      ok('main 就绪', !!main && typeof main.Game === 'function');
      var game = main.boot({ storage: smokeStorage });
      ok('boot 成功', !!game);
      if (!game) {
        document.body.setAttribute('data-smoke', 'fail');
        return;
      }
      game.stop(); // 手动驱动帧，保证断言确定性

      // 音效探针：记录 #9 机制音效是否被调用（不改动真实音频链路之外的行为）
      var sfx = [];
      if (window.MIXX.audio) {
        window.MIXX.audio.play = function (name) { sfx.push(name); return true; };
      }

      var now = 0;
      function frame() { now += 16; game.frame(now); }
      function press(k) {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
        window.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true, cancelable: true }));
      }
      function hold(k, n) {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
        for (var i = 0; i < n; i++) frame();
        window.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true, cancelable: true }));
        frame();
      }
      function tp(tx, ty) { game.player.x = tx * 16; game.player.y = ty * 16; }
      function collectAll() {
        game.level.entities.filter(function (e) { return e.type === 'star'; }).forEach(function (e) {
          tp(e.x, e.y);
          frame();
        });
      }

      // 1) 标题 + 选择存档界面（Issue #8）
      ok('初始 title', game.state === 'title' && shown('title-screen') && !shown('hud'));
      ok('无存档时继续隐藏', !shown('btn-continue') && shown('btn-saves'));

      // 1b) 账户 / 登录入口（Issue #43）：游客打开/返回，零网络请求
      ok('账户入口游客文案', text('btn-account') === '☁ 登录 / 注册');
      document.getElementById('btn-account').click();
      ok('登录界面打开', shown('login-screen') && !shown('title-screen'));
      ok('登录表单可见', shown('login-form') && !shown('login-account'));
      var privacy = document.querySelector('#login-screen .login-privacy a');
      ok('登录页隐私入口', !!privacy && /\/docs\/PRIVACY\.md$/.test(privacy.getAttribute('href'))
        && privacy.getAttribute('rel') === 'noopener');
      document.getElementById('btn-login-back').click();
      ok('登录界面返回', shown('title-screen') && !shown('login-screen'));
      ok('游客态零上传', window.__authFetchCalls === 0);

      document.getElementById('btn-saves').click();
      ok('选择存档界面', shown('save-screen') && !shown('title-screen'));
      ok('空档文案', text('slot-meta-1') === '空档 · 点击开始新游戏');
      document.getElementById('btn-save-back').click();
      ok('存档界面返回', shown('title-screen') && !shown('save-screen'));

      // 2) 开始 → 游玩 + HUD
      document.getElementById('btn-start').click();
      ok('start → playing', game.state === 'playing' && !shown('title-screen'));
      ok('新游戏占档 1', game.saveSlotIndex === 0);
      ok('HUD 关名', text('hud-level') === '占位关卡 · 烛光梦境');
      ok('HUD 星数 0/3', text('hud-shards') === '★ 0/3');

      // 2b) 战斗（Issue #18）：HUD + 敌人 + F 轻击
      ok('战斗 HUD', text('hud-hp') === '♥ 10/10' && !!text('hud-energy-label'));
      ok('占位关敌人', !!game.combat && game.combat.enemies.length === 3);
      var enemy0 = game.combat.enemies[0];
      game.player.x = enemy0.x - 16;
      game.player.y = enemy0.y;
      game.combat.facing = { x: 0, y: 1 }; // 朝下，敌人位于右侧（正面 180° 边界内）：验证自动锁敌
      press('f');
      frame();
      ok('F 轻击命中并自动锁敌', enemy0.hp === 2 && game.combat.energy > 0
        && !!game.combat.swing && game.combat.swing.dir.x > 0.9);

      // 3) 对话往返（Issue #7：打字机逐字 + 点按快进 + 翻页）
      tp(10, 15);
      frame();
      press('e');
      frame();
      ok('→ dialogue', game.state === 'dialogue' && shown('dialog') && text('dialog-name') === 'Byeori');
      ok('对话背景虚化层显示', shown('dialog-backdrop'));
      var portrait = document.getElementById('dialog-portrait');
      ok('头像 src 指向素材', portrait.getAttribute('src') === 'assets/characters/byeori/art/byeori-portrait.png');
      ok('头像显示 + has-portrait', !portrait.classList.contains('hidden')
        && document.getElementById('dialog').classList.contains('has-portrait'));
      var fullLine = 'NSWER！欢迎来到 MIXXTOPIA！我是星星精灵 Byeori。';
      frame(); frame(); frame(); frame(); // 4 × 16ms = 64ms → 2 字（25ms/字）
      ok('打字机逐字', text('dialog-text').length >= 2 && text('dialog-text').length < fullLine.length
        && fullLine.indexOf(text('dialog-text')) === 0);
      press('e'); frame(); // 点按 → 快进本行全文
      ok('点按快进', text('dialog-text') === fullLine);
      press('e'); frame(); // 翻页 → 第 2 行
      press('e'); frame(); // 快进第 2 行
      press('e'); frame(); // 翻页 → 第 3 行（旁白，姓名框隐藏）
      ok('旁白姓名框隐藏', !shown('dialog-name'));
      press('e'); frame(); // 快进第 3 行
      press('e'); frame(); // 翻页 → 退出
      ok('dialogue → playing 清空', game.state === 'playing' && !shown('dialog') && text('dialog-text') === '');
      ok('退出后虚化层隐藏', !shown('dialog-backdrop'));
      ok('退出后头像位复位', portrait.classList.contains('hidden') && portrait.getAttribute('src') === null);

      // 3b) 收集与解谜机制（Issue #9）：关门阻挡 → 推箱压开关 → 开门通行 → 星星粒子
      var gate = game.level.entities.filter(function (e) { return e.type === 'gate'; })[0];
      var sw = game.level.entities.filter(function (e) { return e.type === 'switch'; })[0];
      var box = game.level.entities.filter(function (e) { return e.type === 'box'; })[0];
      ok('机关实体齐全', !!gate && !!sw && !!box);
      tp(33, 11); frame();
      var gateY = game.player.y;
      hold('w', 6);
      ok('关门阻挡', game.player.y === gateY);
      tp(31, 12); frame();
      hold('d', 2);
      ok('推箱一格', box.x === 33 && box.y === 12);
      ok('箱压开关开门', gate.open === true && sw.pressed === true);
      ok('机关音效', sfx.indexOf('switch') >= 0 && sfx.indexOf('gate-open') >= 0);
      tp(30, 12); frame();
      ok('箱压保持开门', gate.open === true);
      tp(33, 11); frame();
      var gateY2 = game.player.y;
      hold('w', 6);
      ok('开门通行', game.player.y < gateY2);
      tp(8, 20); frame();
      ok('星星拾取粒子', game.collected.indexOf('s1') >= 0 && game.particles.count > 0);
      ok('拾取音效', sfx.indexOf('star') >= 0);

      // 4) 暂停往返
      press('Escape');
      frame();
      ok('→ paused', game.state === 'paused' && shown('pause-screen') && !shown('hud'));
      press('Escape');
      frame();
      ok('→ playing', game.state === 'playing' && shown('hud'));

      // 4b) 回到标题（不保存）：进度不写盘
      press('Escape'); frame();
      document.getElementById('btn-quit').click();
      ok('不保存回标题', game.state === 'title' && shown('title-screen') && !shown('btn-continue'));
      document.getElementById('btn-start').click();
      ok('重新开新游戏', game.state === 'playing' && text('hud-shards') === '★ 0/3');

      // 5) 收集 + 结算 + 通关自动存档
      collectAll();
      ok('收集 3 星', text('hud-shards') === '★ 3/3');
      ok('传送门激活', game._portalActive() === true);
      ok('传送门激活音效', sfx.indexOf('portal') >= 0);
      tp(38, 10);
      frame();
      ok('→ clear', game.state === 'clear' && shown('clear-screen') && /星星 3\/3/.test(text('clear-text')));
      ok('进入传送门音效', sfx.indexOf('portal-enter') >= 0);
      var saveRaw = JSON.parse(smokeStorage.getItem('mixxtopia.save.v1'));
      ok('通关自动存档', !!saveRaw && !!saveRaw.slots[0]
        && saveRaw.slots[0].current === 2 && saveRaw.slots[0].cleared.indexOf(1) >= 0);

      // 6) 下一关 → 保存并退出 → 继续冒险读档
      document.getElementById('btn-next').click();
      ok('下一关 playing', game.state === 'playing' && text('hud-shards') === '★ 0/2');
      press('Escape'); frame();
      document.getElementById('btn-save-quit').click();
      ok('保存并退出 → title', game.state === 'title' && shown('title-screen') && shown('btn-continue'));
      document.getElementById('btn-continue').click();
      ok('继续 → 第 2 关', game.state === 'playing' && game.level.id === 2
        && text('hud-shards') === '★ 0/2');

      // 7) 末关 → 结局 → 标题
      collectAll();
      tp(38, 10);
      frame();
      ok('末关 clear 按钮文案', game.state === 'clear' && text('btn-next') === '▶ 见证结局');
      document.getElementById('btn-next').click();
      ok('→ ending', game.state === 'ending' && shown('ending-screen'));
      ok('结局文案渲染', document.getElementById('ending-body').innerHTML.indexOf('25 颗愿望之星') >= 0);
      document.getElementById('btn-ending').click();
      ok('ending → title', game.state === 'title' && shown('title-screen'));
      ok('结局后存档仍在', shown('btn-continue'));

      // 8) 无泄漏
      ok('无残留屏幕', !shown('hud') && !shown('dialog') && !shown('pause-screen')
        && !shown('clear-screen') && !shown('ending-screen') && !shown('save-screen')
        && !shown('settings-screen'));
      ok('对话框清空', text('dialog-text') === '' && text('dialog-name') === '');

      // 9) 账户资料 / 设置（Issue #44）：真实 DOM + fetch 桩切到「在线」
      ok('游客态标题设置入口可见', shown('btn-title-settings'));
      document.getElementById('btn-title-settings').click();
      ok('游客打开设置', shown('settings-screen') && !shown('title-screen') && !shown('login-screen'));
      ok('游客昵称与头像禁用', document.getElementById('settings-nickname').disabled
        && Array.from(document.querySelectorAll('#avatar-options button')).every(btn => btn.disabled));
      ok('游客触屏偏好可用', !document.getElementById('btn-pref-touch').disabled);
      ok('游客统计接线且不可上传', !!game.stats && /游客统计/.test(text('stats-status'))
        && document.getElementById('btn-stats-sync').disabled);
      document.getElementById('btn-settings-back').click();
      ok('游客设置返回标题', shown('title-screen') && !shown('settings-screen'));
      window.__smokeOnline = true;
      document.getElementById('btn-account').click();
      document.getElementById('login-email').value = 'smoke@example.com';
      document.getElementById('login-password').value = 'secret123';
      document.getElementById('btn-login').click();
      await game._authPromise;
      await settle();
      ok('登录成功（冒烟）', text('btn-account') === '☁ 账户 · 小星');
      ok('设置入口显示', shown('btn-settings'));
      ok('登录面板昵称回填', text('login-nickname-label') === '小星');
      document.getElementById('btn-settings').click();
      ok('设置界面打开', shown('settings-screen') && !shown('login-screen'));
      ok('昵称输入回填', document.getElementById('settings-nickname').value === '小星');
      ok('资料就绪后才可保存', document.getElementById('btn-settings-save').disabled === false
        && document.getElementById('btn-settings-retry').classList.contains('hidden'));
      ok('字数提示 2/16', text('settings-nickname-count') === '2/16');
      var avatarBox = document.getElementById('avatar-options');
      ok('六个固定头像', avatarBox.children.length === 6);
      var muse3 = avatarBox.querySelector('[data-avatar="muse-3"]');
      ok('默认选中云端头像', !!muse3 && muse3.classList.contains('is-selected'));
      ok('头像预览名', text('avatar-preview-name') === 'Sullyoon');

      // 选头像 + 改昵称 + 切偏好 → 保存（PATCH profiles）
      avatarBox.querySelector('[data-avatar="muse-5"]').click();
      document.getElementById('settings-nickname').value = '冒烟小星';
      game._onNicknameInput();
      ok('字数提示 4/16', text('settings-nickname-count') === '4/16');
      document.getElementById('btn-pref-touch').click(); // auto → on
      ok('触屏偏好立即生效', document.getElementById('touch-controls').classList.contains('touch-pref-on'));
      document.getElementById('btn-pref-sound').click(); // 开 → 关
      ok('声音偏好立即生效', text('btn-pref-sound') === '♪ 声音：关' && text('btn-sound') === '♪ 声音：关');
      var patchesBefore = profilePatches().length;
      document.getElementById('btn-settings-save').click();
      await game._accountPromise;
      await settle();
      var patches = profilePatches();
      ok('保存发一次 PATCH', patches.length === patchesBefore + 1);
      var patch = patches[patches.length - 1];
      ok('PATCH 内容正确', !!patch && patch.body.nickname === '冒烟小星'
        && patch.body.avatar === 'muse-5'
        && patch.body.prefs.sound === false && patch.body.prefs.touch === 'on');
      ok('保存成功提示', text('settings-msg') === '设置已保存。');
      ok('标题显示新昵称', text('btn-account') === '☁ 账户 · 冒烟小星');
      var localSettings = JSON.parse(smokeStorage.getItem('mixxtopia.settings.v1'));
      ok('偏好写入本地 settings', !!localSettings
        && localSettings.sound === false && localSettings.touch === 'on');

      // 超长昵称：客户端拒绝且不发请求
      document.getElementById('settings-nickname').value = '一二三四五六七八九十一二三四五六七';
      var patchesBeforeBad = profilePatches().length;
      document.getElementById('btn-settings-save').click();
      await nextTick();
      ok('超长昵称被拒', /昵称最多 16 字/.test(text('settings-msg'))
        && profilePatches().length === patchesBeforeBad);

      // 删除账户只走 GitHub issue 申请链接（前端不删 auth.users）
      var del = document.getElementById('link-delete-account');
      ok('删除账户走 GitHub 申请',
        /github\.com\/ideer0126\/MIXXTOPIA\/issues\/new/.test(del.getAttribute('href'))
        && del.getAttribute('target') === '_blank');

      // #45 real DOM + fetch stubs: merge, offline save, retry, cloud-newer choice.
      await game._cloudTask;
      game._openSaveScreen('load');
      ok('云存档合并提示', shown('cloud-merge') && /并入账户/.test(text('cloud-status')));
      document.getElementById('btn-cloud-merge').click(); await game._cloudTask;
      ok('并入后上传成功', !!window.__cloudRows[0] && /已同步/.test(text('cloud-meta-1')));
      game._closeSaveScreen();
      game._continueGame();
      game.sheepCount = 4;
      game._setState('paused');
      window.__smokeOnline = false;
      ok('离线保存立即回标题', game._saveAndQuit() && game.state === 'title');
      await game._cloudTask;
      ok('离线进度保留及未同步提示', game.store.readSlot(0).sheep === 4 && /未同步/.test(text('title-cloud-status')));
      window.__smokeOnline = true;
      await game.cloud.refresh(true);
      ok('重试补传', window.__cloudRows[0].data.sheep === 4 && game.cloud.state(0) === 'synced');
      window.__cloudRows[0].version++;
      window.__cloudRows[0].updated_at = new Date(Date.now() + 5000).toISOString();
      window.__cloudRows[0].data.sheep = 6;
      await game.cloud.refresh(); game._openSaveScreen('load');
      ok('云端较新但未自动覆盖', /云端较新/.test(text('cloud-meta-1')) && game.store.readSlot(0).sheep === 4);
      document.getElementById('btn-cloud-download-1').click();
      ok('载入需再次确认', /确认/.test(text('btn-cloud-download-1')) && game.store.readSlot(0).sheep === 4);
      document.getElementById('btn-cloud-download-1').click(); await game._cloudTask;
      ok('确认后载入云端', game.store.readSlot(0).sheep === 6 && game.cloud.state(0) === 'synced');
      game._closeSaveScreen(); game._openSettingsScreen();
      await settle();
      ok('账户统计接线且同步成功', /已同步/.test(text('stats-status')) && /小时/.test(text('stats-time'))
        && /%/.test(text('stats-collection')));
      var rpcBefore = window.__fetchCalls.filter(function (c) { return c.url.indexOf('/rpc/merge_stats') >= 0; }).length;
      document.getElementById('btn-stats-sync').click(); await settle();
      ok('手动同步统计按钮', window.__fetchCalls.filter(function (c) { return c.url.indexOf('/rpc/merge_stats') >= 0; }).length > rpcBefore);

      // 返回登录面板 → 登出回游客
      document.getElementById('btn-settings-back').click();
      ok('设置返回登录面板', shown('login-screen') && !shown('settings-screen') && shown('login-account'));
      document.getElementById('btn-logout').click();
      await game._authPromise;
      await settle();
      ok('登出回游客（冒烟）', text('btn-account') === '☁ 登录 / 注册' && game.profile === null);
      ok('登出后设置入口隐藏', !shown('btn-settings'));
      document.getElementById('btn-login-back').click();
      ok('返回标题（冒烟）', shown('title-screen'));

      document.getElementById('btn-account').click();
      document.getElementById('login-email').value = 'smoke@example.com';
      document.getElementById('login-password').value = 'secret123';
      document.getElementById('btn-register').click(); await game._authPromise; await settle();
      ok('注册自动登录（fetch 桩）', !!game.auth.getSession() && shown('login-account')
        && window.__fetchCalls.some(function (c) { return c.url.indexOf('/auth/v1/signup') >= 0; }));
      ok('注册登出不清本地存档', game.store.readSlot(0).sheep === 6);

      ok('无运行时错误', errors.length === 0);
      } catch (e) {
        errors.push('FATAL: ' + (e && (e.stack || e.message) || e));
      }

      var pre = document.getElementById('results');
      pre.textContent = results.join('\n') + (errors.length ? '\nERRORS: ' + errors.join(' | ') : '');
      document.body.setAttribute('data-smoke',
        results.every(function (l) { return l.indexOf('PASS') === 0; }) && errors.length === 0 ? 'ok' : 'fail');
    })().catch(function (e) {
      var pre = document.getElementById('results');
      if (pre) pre.textContent = 'FATAL: ' + (e && (e.stack || e.message) || e);
      document.body.setAttribute('data-smoke', 'fail');
    });
  </script>
</body>
</html>
