<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>找回密码 · MIXXTOPIA</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
  <script src="js/cloud-config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/password-recovery.js" defer></script>
</head>
<body class="recovery-page">
  <main class="recovery-card" aria-labelledby="recovery-title">
    <p class="recovery-brand">MIXXTOPIA · Strange Muse</p>
    <h1 id="recovery-title" class="screen-title">找回密码</h1>
    <p id="recovery-note" class="login-note">输入注册邮箱，我们会发送密码重置链接。</p>
    <form id="recovery-request" class="login-form">
      <label class="login-field">
        <span>注册邮箱</span>
        <input id="recovery-email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required />
      </label>
      <button id="recovery-send" class="menu-btn" type="submit">发送重置邮件</button>
    </form>
    <form id="recovery-reset" class="login-form hidden" aria-describedby="recovery-note">
      <p id="recovery-account" class="login-account-line"></p>
      <label class="login-field">
        <span>新密码</span>
        <input id="recovery-password" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <label class="login-field">
        <span>确认新密码</span>
        <input id="recovery-confirm" type="password" autocomplete="new-password" minlength="6" required />
      </label>
      <button id="recovery-save" class="menu-btn" type="submit">确认重置密码</button>
    </form>
    <p id="recovery-msg" class="login-msg" role="status" aria-live="polite"></p>
    <button id="recovery-again" class="menu-btn small hidden" type="button">重新申请重置邮件</button>
    <a class="recovery-link" href="index.html">← 返回游戏</a>
    <p class="login-privacy">提交后仅向账户认证服务发送邮箱或密码。本机存档和设置会保留；重置完成后请使用新密码登录。<a href="https://github.com/ideer0126/MIXXTOPIA/blob/main/docs/PRIVACY.md" target="_blank" rel="noopener noreferrer">隐私说明</a></p>
    <noscript><p>请启用 JavaScript 后重新打开本页。</p></noscript>
  </main>
</body>
</html>
